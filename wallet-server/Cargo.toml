[package]
name = "syuzhet-wallet-server"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Using ethers 1.x for better compatibility
# Using git source to bypass crates.io download issues
ethers = { git = "https://github.com/gakonst/ethers-rs", tag = "v1.0.0", features = ["legacy"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
hex = "0.4"
env_logger = "0.11"
log = "0.4"

